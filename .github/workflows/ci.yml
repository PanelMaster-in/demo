name: Package Install Stress Test

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  install-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [8.3, 8.4]

    steps:
      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          extensions: mbstring, bcmath, intl

      - name: Pre-clone repositories (for pull stress)
        run: |
          set +e

          git clone https://github.com/ghostcompiler/laravel-react-jsx.git || true
          git clone https://github.com/ghostcompiler/laravel-auth.git || true
          git clone https://github.com/ghostcompiler/laravel-uploads.git || true
          git clone https://github.com/ghostcompiler/laravel-querybuilder.git || true

      - name: Run install loop (stress test)
        run: |
          set +e

          for i in {1..100}
          do
            echo "=============================="
            echo "PHP ${{ matrix.php }} | Run #$i"
            echo "=============================="

            # Composer create project
            composer create-project ghostcompiler/laravel-react-jsx test-app-$i --no-interaction --prefer-dist || echo "create-project failed"

            cd test-app-$i || continue

            # Require packages
            composer require ghostcompiler/laravel-querybuilder  --no-interaction --prefer-dist || echo "querybuilder failed"
            composer require ghostcompiler/laravel-uploads --no-interaction --prefer-dist || echo "uploads failed"
            composer require ghostcompiler/laravel-auth --no-interaction --prefer-dist || echo "auth failed"

            cd ..

            # Git pull stress (uses pre-cloned repos)
            echo "Updating repositories..."

            cd laravel-react-jsx && git pull || echo "pull failed (react-jsx)" && cd ..
            cd laravel-auth && git pull || echo "pull failed (auth)" && cd ..
            cd laravel-uploads && git pull || echo "pull failed (uploads)" && cd ..

            # Cleanup
            rm -rf test-app-$i || true

            echo "Sleeping 10 seconds..."
            sleep 20
          done
