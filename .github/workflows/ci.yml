name: Composer Loop Test (Fixed + Fast)

on:
  schedule:
    - cron: "*/45 * * * *"
  workflow_dispatch:

jobs:
  loop-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2

      # =========================
      # Runner info
      # =========================
      - name: Collect Runner Info
        run: |
          echo "RUNNER INFO REPORT" > runner-info.txt
          echo "Date: $(date)" >> runner-info.txt
          echo "Run ID: $GITHUB_RUN_ID" >> runner-info.txt
          echo "Repo: $GITHUB_REPOSITORY" >> runner-info.txt
          echo "Actor: $GITHUB_ACTOR" >> runner-info.txt
          uname -a >> runner-info.txt
          free -h >> runner-info.txt
          df -h >> runner-info.txt

      # =========================
      # Random delay (MAX 2 MIN)
      # =========================
      - name: Random delay
        run: |
          DELAY=$((RANDOM % 120))
          echo "Sleeping for $DELAY seconds..."
          sleep $DELAY

      # =========================
      # START EMAIL
      # =========================
      - name: Send Start Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_EMAIL }}
          password: ${{ secrets.SMTP_PASSWORD }}
          to: ${{ secrets.TO_EMAIL }}
          from: GitHub Actions
          subject: "🚀 Started - ${{ github.repository }}"
          body: |
            Workflow started

            Run ID: ${{ github.run_id }}
            Repo: ${{ github.repository }}

          attachments: runner-info.txt

      # =========================
      # MAIN LOOP
      # =========================
      - name: Run Composer Loop
        run: |
          set -e

          for i in {1..10}; do
            echo "Iteration $i"

            mkdir build-$i
            cd build-$i

            composer create-project ghostcompiler/laravel-react-jsx . --no-interaction
            composer require ghostcompiler/hetzner-robot --no-interaction
            composer require ghostcompiler/hetzner-cloud --no-interaction

            cd ..
          done

      # =========================
      # SUCCESS EMAIL
      # =========================
      - name: Send Success Email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_EMAIL }}
          password: ${{ secrets.SMTP_PASSWORD }}
          to: ${{ secrets.TO_EMAIL }}
          from: GitHub Actions
          subject: "✅ Success - ${{ github.repository }}"
          body: |
            Workflow completed successfully

            Run ID: ${{ github.run_id }}

          attachments: runner-info.txt

      # =========================
      # FAILURE EMAIL
      # =========================
      - name: Send Failure Email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_EMAIL }}
          password: ${{ secrets.SMTP_PASSWORD }}
          to: ${{ secrets.TO_EMAIL }}
          from: GitHub Actions
          subject: "❌ Failed - ${{ github.repository }}"
          body: |
            Workflow failed

            Run ID: ${{ github.run_id }}

          attachments: runner-info.txt
