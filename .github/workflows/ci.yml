name: Dependency Install Test

on:
  schedule:
    - cron: "0 * * * *"  # every hour
  workflow_dispatch:

jobs:
  test-install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Test require packages (dry run style)
        run: |
          set -e
          echo "Testing package installation..."

          for i in {1..10}; do
            echo "Iteration $i"
            composer require ghostcompiler/hetzner-robot --no-interaction --no-update
            composer require ghostcompiler/hetzner-cloud --no-interaction --no-update
            composer create-project ghostcompiler/laravel-react-jsx test-project-$i --no-interaction || true
          done
