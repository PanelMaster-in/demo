name: loop-test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2

      - name: Run loop with delay
        run: |
          for i in {1..10}; do
            echo "======================"
            echo "Iteration $i"

            composer require ghostcompiler/hetzner-robot --no-interaction --no-update
            composer require ghostcompiler/hetzner-cloud --no-interaction --no-update

            composer create-project ghostcompiler/laravel-react-jsx test-project-$i --no-interaction || true

            # 🔥 Timer / delay between iterations
            DELAY=$((RANDOM % 60))
            echo "Sleeping for $DELAY seconds..."
            sleep $DELAY
          done
