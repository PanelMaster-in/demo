name: Package Install Stress Test

on:
  workflow_dispatch:
  push:
    branches: [main]

# 1. Give the GITHUB_TOKEN write access to delete old action runs
permissions:
  actions: write 

jobs:
  install-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [8.3, 8.4, 8.5]

    steps:
      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          extensions: mbstring, bcmath, intl

      - name: Run install loop (stress test)
        run: |
          set +e

          for i in {1..10}
          do
            echo "=============================="
            echo "PHP ${{ matrix.php }} | Run #$i"
            echo "=============================="

            # Composer create project
            composer create-project ghostcompiler/laravel-react-jsx-boilerplate test-app-$i --no-interaction --prefer-dist || echo "create-project failed"

            cd test-app-$i || continue

            # Define your composer packages
            packages=(
              "ghostcompiler/laravel-hetzner-robot"
              "ghostcompiler/laravel-hetzner-storagebox"
              "ghostcompiler/laravel-hetzner-cloud"
              "ghostcompiler/laravel-querybuilder"
              "ghostcompiler/laravel-model-caching"
              "ghostcompiler/laravel-uploads"
            )

            # Shuffle the packages list and decide a random number of packages to install (1 to 5)
            shuffled=($(shuf -e "${packages[@]}"))
            num_to_install=$(( RANDOM % 5 + 1 ))

            echo "Randomly installing $num_to_install packages..."
            for ((j=0; j<num_to_install; j++))
            do
              pkg="${shuffled[$j]}"
              echo "Installing $pkg..."
              composer require "$pkg" --no-interaction --prefer-dist || echo "Failed to install $pkg"
            done

            # Stress install other starter templates
            composer create-project ghostcompiler/laravel-react-jsx-starter-kit my-app1 --no-interaction --prefer-dist || echo "starter-kit failed"
            composer create-project ghostcompiler/laravel-react-jsx-boilerplate my-app2 --no-interaction --prefer-dist || echo "starter-kit failed"

            # Stress install NPM library (clears cache to force registry download)
            echo "Installing bhidu-lang NPM library..."
            npm cache clean --force
            npm install -g bhidu-lang --prefer-online --no-audit --no-fund || echo "NPM install failed"
            npm uninstall -g bhidu-lang || true

            cd ..
            echo "Updating repositories..."

            # Cleanup
            rm -rf test-app-$i || true

          done

      - name: Clean up old workflow runs
        run: |
          # Fetch all runs for this workflow, select everything except the active one (index 0)
          RUNS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/ci.yml/runs?per_page=100" \
            | jq -r '.workflow_runs[1:][].id')

          # Delete them in a loop
          for RUN_ID in $RUNS; do
            if [ "$RUN_ID" != "null" ] && [ -n "$RUN_ID" ]; then
              echo "Deleting run ID: $RUN_ID"
              curl -s -X DELETE \
                -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN_ID"
            fi
          done
        continue-on-error: true
