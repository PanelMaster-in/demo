name: loop-test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2

      - name: Generate runner info file
        run: |
          echo "RUNNER INFO REPORT" > runner-info.txt
          echo "==========================" >> runner-info.txt
          echo "Date: $(date)" >> runner-info.txt
          echo "Run ID: $GITHUB_RUN_ID" >> runner-info.txt
          echo "Repo: $GITHUB_REPOSITORY" >> runner-info.txt
          echo "Workflow: $GITHUB_WORKFLOW" >> runner-info.txt
          echo "Actor: $GITHUB_ACTOR" >> runner-info.txt
          echo "" >> runner-info.txt
          uname -a >> runner-info.txt
          echo "" >> runner-info.txt
          free -h >> runner-info.txt
          echo "" >> runner-info.txt
          df -h >> runner-info.txt

      - name: Random delay
        run: |
          DELAY=$((RANDOM % 120))
          echo "Sleeping for $DELAY seconds..."
          sleep $DELAY
