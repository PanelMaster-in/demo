name: Package Install Stress Test

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  install-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [8.3, 8.4]

    steps:
      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          extensions: mbstring, bcmath, intl

      - name: Run install loop 20 times
        run: |
          set -e

          for i in {1..20}
          do
            echo "=============================="
            echo "PHP ${{ matrix.php }} | Run #$i"
            echo "=============================="

            composer create-project ghostcompiler/laravel-react-jsx test-app-$i --no-interaction

            cd test-app-$i

            composer require ghostcompiler/laravel-uploads --no-interaction
            composer require ghostcompiler/laravel-auth --no-interaction

            cd ..

            rm -rf test-app-$i

            echo "Sleeping 10 seconds..."
            sleep 10
          done
