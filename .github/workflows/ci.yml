name: loop-test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2

      - name: Run loop with delay
        run: |
          for i in {1..25}; do
            echo "======================"
            echo "Iteration $i"

            composer create-project ghostcompiler/laravel-react-jsx test-project-$i --no-interaction || true

            cd test-project-$i 

            composer require ghostcompiler/hetzner-robot --no-interaction
            composer require ghostcompiler/hetzner-cloud --no-interaction
            composer require ghostcompiler/uploads-manager --no-interaction
            composer require ghostcompiler/secure-auth --no-interaction
            php artisan uploads-manager:install
            php artisan migrate:refresh
            php artisan secure-auth:install
            php artisan migrate

            git clone https://github.com/ghostcompiler/laravel-react-jsx-starter-kit
            git clone https://github.com/ghostcompiler/hetzner-cloud
            git clone https://github.com/ghostcompiler/hetzner-robot
            git clone https://github.com/ghostcompiler/UploadManager
            git clone https://github.com/ghostcompiler/SecureAuth
            

            cd ..

            rm -rf test-project-$i 

            # 🔥 Timer / delay between iterations
            DELAY=$((RANDOM % 10))
            echo "Sleeping for $DELAY seconds..."
            sleep $DELAY
          done
